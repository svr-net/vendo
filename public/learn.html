<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendo Academy</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header id="nav"></header>
<main class="container">
  <div class="row spread" style="margin-bottom:20px">
    <div>
      <h1>Vendo Academy</h1>
      <p class="muted" style="margin:0">Everything you need to run your first campaigns, in about 50 minutes.</p>
    </div>
    <div style="min-width:220px">
      <small id="progress-label">0% complete</small>
      <div class="progress"><div id="progress-bar" style="width:0"></div></div>
    </div>
  </div>
  <div class="learn">
    <aside class="card lesson-nav" id="lesson-nav"></aside>
    <article class="card lesson" id="lesson"></article>
  </div>
</main>
<script type="module" src="/js/learn.js"></script>
</body>
</html>
