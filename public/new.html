<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New campaign – Vendo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="nav"></header>
<main class="container">
  <div class="row spread">
    <h1 id="title">Create a campaign</h1>
    <button class="btn btn-sm" id="reset">Start over</button>
  </div>
  <nav class="stepper" id="stepper"></nav>
  <div class="wizard">
    <section class="card" id="step"></section>
    <aside class="coach">
      <div class="card">
        <h3>🎓 Coach</h3>
        <div id="coach"></div>
      </div>
      <div class="card" id="check-card">
        <h3>✅ Readiness</h3>
        <div id="check"><small class="muted">Checks appear as you fill in the form.</small></div>
      </div>
    </aside>
  </div>
</main>
<script type="module" src="js/wizard.js"></script>
</body>
</html>
